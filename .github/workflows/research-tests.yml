name: Research tests

on:
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/research-tests.yml"
  push:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/research-tests.yml"
  workflow_dispatch:

jobs:
  methodology-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost arch joblib
      - name: Run methodology tests
        run: python -m unittest discover -s tests -v
