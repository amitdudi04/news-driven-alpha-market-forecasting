name: Research tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  methodology-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install methodology-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy statsmodels scikit-learn arch

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run methodology tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository structure and frozen specs
        run: python scripts/validate_repository.py
