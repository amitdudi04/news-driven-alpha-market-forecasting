name: Research tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  methodology-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost arch joblib
      - name: Run methodology and data-consistency tests
        run: python -m unittest discover -s tests -v
      - name: Run saved-data research smoke test
        run: python run_research_pipeline.py
