version: "3.8"

services:
  execution_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_execution_engine
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./models:/app/models
      - ./archive:/app/archive
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "python", "container_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  observability:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_observability
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    command: python observability_engine.py
    restart: always
